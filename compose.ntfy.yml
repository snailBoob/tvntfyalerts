# Optional overlay: docker compose --env-file docker.env -f compose.yml -f compose.ntfy.yml up -d
services:
  app:
    environment:
      NTFY_URL: http://ntfy:80
      NTFY_TOKEN: ""
    depends_on:
      - ntfy
  ntfy:
    image: binwiederhier/ntfy:v2.25.0
    command: [serve]
    restart: unless-stopped
    ports:
      - "${NTFY_BIND:-127.0.0.1}:${NTFY_PORT:-8080}:80"
    environment:
      NTFY_BASE_URL: "${NTFY_PUBLIC_URL:-http://localhost:8080}"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
    volumes:
      - ntfy-cache:/var/cache/ntfy
volumes:
  ntfy-cache:
