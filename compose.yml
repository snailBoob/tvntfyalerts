name: tv-ntfy
services:
  app:
    image: ghcr.io/snailboob/tvntfyalerts:1.0.1
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3080}:3080"
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      PUBLIC_URL: "${PUBLIC_URL:?Set PUBLIC_URL in docker.env}"
      NTFY_URL: "${NTFY_URL:?Set NTFY_URL in docker.env}"
      NTFY_TOPIC: "${NTFY_TOPIC:-tradingview-alerts}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
    volumes:
      - app-state:/state
volumes:
  app-state:
